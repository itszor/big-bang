; libroger's settings for bigbang (beside it, as <program>.ini)

[crop]
; --crop: the rows of the 256-line screen to show (FIRST-LAST, or all),
; to start with and from when the code at an address first runs (in hex)

; everything - the Psycore picture, the intro, the menus, the worlds'
; title cards and play (the play area between its two colour bars) - is
; in rows 28-227, black above and below. The M key's mini mode (mode 112,
; 128 lines) is shown whole
rows = 28-227
